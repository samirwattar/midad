<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغيير كلمة المرور — ميداد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="logo" href="index.html">
        <span class="logo-mark"><i data-icon="quill"></i></span>
        ميداد<small>MIDAD · روايات</small>
      </a>
      <nav class="nav-links">
        <a href="index.html"><i data-icon="home"></i>الرئيسية</a>
        <a href="index.html#latest"><i data-icon="book"></i>قائمة الروايات</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="auth-shell">
      <div class="container">
        
        <!-- auth-single sätter bredden till 440px och centrerar rutan -->
        <div class="auth-single">
          <div class="form-card auth-card">
            <h1 class="serif">تغيير كلمة المرور</h1>
            <p class="auth-sub">أدخل كلمة المرور الجديدة الخاصة بحسابك لتتمكن من تسجيل الدخول مجددًا.</p>

            <div class="form-alert" id="reset-alert" role="alert"></div>

            <form id="reset-password-form" novalidate>
              
              <div class="form-row" id="row-password">
                <label for="new-password">كلمة المرور الجديدة</label>
                <div class="password-field">
                  <input type="password" id="new-password" autocomplete="new-password" required>
                  <button type="button" class="password-toggle" data-toggle-for="new-password" aria-label="إظهار كلمة المرور">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  </button>
                </div>
                <div class="form-hint">6 أحرف على الأقل</div>
                <div class="field-error" id="err-password"></div>
              </div>

              <div class="form-row" id="row-password-confirm">
                <label for="confirm-password">تأكيد كلمة المرور</label>
                <div class="password-field">
                  <input type="password" id="confirm-password" autocomplete="new-password" required>
                  <button type="button" class="password-toggle" data-toggle-for="confirm-password" aria-label="إظهار كلمة المرور">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  </button>
                </div>
                <div class="field-error" id="err-password-confirm"></div>
              </div>

              <button type="submit" class="btn btn-primary btn-block" id="reset-submit">تحديث كلمة المرور</button>

              <p class="auth-switch">تذكرت كلمة المرور؟ <a href="login.html">تسجيل الدخول</a></p>
            </form>
          </div>
        </div>

      </div>
    </section>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
